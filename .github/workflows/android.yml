name: Android release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit, lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run release gate
        run: ./gradlew clean testDebugUnitTest lintDebug lintRelease assembleDebugAndroidTest bundleRelease --no-daemon
      - name: Upload unsigned release artifacts and mappings
        uses: actions/upload-artifact@v7
        with:
          name: numina-release-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/**
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**

  device-tests:
    name: Device tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36]
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          else
            echo 'KVM is unavailable on this runner' >&2
            exit 1
          fi
      - name: Install and create emulator
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo no | avdmanager create avd --force --name numina-ci --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_2
      - name: Boot emulator
        run: |
          nohup emulator -avd numina-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Run isolated instrumented tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-api-${{ matrix.api }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/emulator.log
